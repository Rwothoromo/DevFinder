def coverageSourceDirs = [
        'src/main/java',
        'src/debug/java',
        'src/mock/java',
        'src/prod/java'
]

tasks.register('jacocoTestReport', JacocoReport) {
    description = 'Generate JaCoCo coverage report'
    group = 'Reporting'

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.getBuildDirectory().dir('jacocoHtml')
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/*$ViewInjector*.*',
            '**/*$ViewBinder*.*',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            'android/**/*.*',
            '**/*Fragment.*',
            '**/*Activity.*',
            '**/*ViewModel.*',
            '**/*$*$*.*',  // Exclude Kotlin lambdas and synthetic classes
            '**/Hilt_*.*'   // Exclude Hilt generated classes
    ]

    // Use the non-instrumented classes from the correct directory
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def kotlinMainSrc = "${project.projectDir}/src/main/kotlin"

    classDirectories.setFrom(files([debugTree]))
    sourceDirectories.setFrom(files([coverageSourceDirs], [kotlinMainSrc]))

    // Specify execution data files that JaCoCo will use to generate coverage report
    executionData.setFrom(
            fileTree(
                    dir: "$buildDir",
                    includes: ['**/*.exec', '**/*.ec',
                               "jacoco/testDebugUnitTest.exec",
                               "outputs/code-coverage/connected/*coverage.ec"
                    ]))
}

tasks.register('unifiedCoverageReport') {
    check.dependsOn 'clean', 'jacocoTestReport', 'createProdDebugCoverageReport'
    description = 'Generates coverage report which includes both local unit tests and instrumentation tests'
    group = 'Reporting'
}